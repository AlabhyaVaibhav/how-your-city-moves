# Every pull request must say which issue it resolves ("Closes #12", "Fixes #12" or "Resolves #12").
# This check is required on main, so a PR without a real, linked issue can't be merged.
name: Linked issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || "";
            const refs = [...body.matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)\b/gi)].map(m => Number(m[1]));
            if (!refs.length) {
              core.setFailed('Link the issue this PR resolves in the description, e.g. "Closes #12". Open an issue first if there isn\'t one.');
              return;
            }
            for (const n of refs) {
              try {
                const { data } = await github.rest.issues.get({ ...context.repo, issue_number: n });
                if (data.pull_request) core.setFailed(`#${n} is a pull request, not an issue.`);
                else core.info(`Linked to issue #${n}: ${data.title}`);
              } catch {
                core.setFailed(`#${n} isn't an issue in this repository.`);
              }
            }
