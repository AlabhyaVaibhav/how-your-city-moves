name: Report a bug
description: Something on How Bangalore moves is broken or looks wrong.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please don't include personal details (your real name, address, or exact commute) here — issues are public.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: I added myself and the dot never moved…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the home page
        2. Tap "Add yourself"
        3. …
  - type: dropdown
    id: page
    attributes:
      label: Which page?
      options: [Home (the map), About me, Support, Privacy, Legal, Other]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 13, Safari / Pixel 7, Chrome / MacBook, Firefox
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images in here if you have them.
